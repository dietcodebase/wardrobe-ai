name: iOS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: Build and smoke tests
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build and test pinned simulator
        run: ./scripts/check-ios.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M00-test-results
          path: build/M00.xcresult
          if-no-files-found: ignore
